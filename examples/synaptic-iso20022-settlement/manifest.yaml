# OpenEAGO Example Manifest — manifest.yaml
# ============================================================

type: "standalone"
status: "active"
language: "python"

description: "Layer-1 ISO 20022 settlement & audit anchoring runtime using SynapticChain. Enforces agent spending velocity, merchant allowlists, pacs.008 customer credit transfers, and sub-500ms deterministic pacs.002 audit receipts across 2,048 parallel execution lanes."

architecture:
  agent: "multi"
  stateful: true
  datasources:
    - "local"
    - "external"

dependencies:
  libraries:
    - "dataclasses"
    - "typing"
    - "hashlib"
    - "json"
  services:
    - "SynapticChain Layer-1"

ownership:
  team: "Synaptics-Lab & OpenEAGO Community"
  poc: "AbdlShbz"

tags:
  - "iso20022"
  - "settlement"
  - "audit-anchoring"
  - "pacs-008"
  - "pacs-002"
  - "dora"
  - "bcbs-239"
  - "layer-1"
  - "synapticchain"
  - "smart-contracts"

license: "Apache-2.0"
