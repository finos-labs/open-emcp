[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "synaptic-iso20022-settlement"
version = "0.1.0"
description = "SynapticChain Layer-1 ISO 20022 settlement and audit anchoring runtime for OpenEAGO"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Synaptics-Lab", email = "veritasvaultone@gmail.com" }
]
license = { text = "Apache-2.0" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
